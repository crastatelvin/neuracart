<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="NeuraCart — the AI-native neighbourhood market. Forecast, substitute, route and answer in one loop.">
  <title>NeuraCart — the AI-native neighbourhood market</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4FBF6"/>
      <stop offset="0.55" stop-color="#EAF7EF"/>
      <stop offset="1" stop-color="#F8FDF9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#064E3B"/>
      <stop offset="0.45" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#F1F9F4" stop-opacity="0.96"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#0F172A" stroke-opacity="0.05"/>
    </pattern>
    <style>
      .orb-a { animation: driftA 16s ease-in-out infinite; }
      .orb-b { animation: driftB 20s ease-in-out infinite; }
      .sheen { animation: sheen 7s ease-in-out infinite; }
      .float { animation: float 6s ease-in-out infinite; }
      .dot { animation: blink 2.4s ease-in-out infinite; }
      .dot-2 { animation: blink 2.4s ease-in-out 0.4s infinite; }
      .dot-3 { animation: blink 2.4s ease-in-out 0.8s infinite; }
      .bar-1 { animation: bar 4s ease-in-out infinite; }
      .bar-2 { animation: bar 4s ease-in-out 0.5s infinite; }
      .bar-3 { animation: bar 4s ease-in-out 1s infinite; }
      @keyframes driftA { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(34px, 22px); } }
      @keyframes driftB { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-28px, -18px); } }
      @keyframes sheen { 0%, 100% { transform: translateX(-30px); opacity: 0.25; } 50% { transform: translateX(310px); opacity: 0.7; } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes blink { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      @keyframes bar { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.72); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle class="orb-a" cx="170" cy="80" r="240" fill="url(#glowA)"/>
  <circle class="orb-b" cx="1060" cy="360" r="260" fill="url(#glowB)"/>

  <!-- mark -->
  <rect x="64" y="58" width="58" height="58" rx="18" fill="url(#mark)"/>
  <path d="M93 71c-9 3-15 11-15 21 0 3 1 6 2 8 10-1 18-8 20-18 1-4 0-8-1-11-2 1-4 2-6 0Z" fill="#ECFDF5"/>
  <path d="M80 104c6-10 14-16 24-20" stroke="#065F46" stroke-width="3" stroke-linecap="round" fill="none"/>

  <text x="142" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="48" font-weight="800" letter-spacing="-1.6" fill="url(#brand)">NeuraCart</text>
  <text x="66" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="#065F46">The AI-native neighbourhood market</text>
  <text x="66" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#047857" fill-opacity="0.85">Forecast · substitute · route · answer — one continuous loop.</text>

  <!-- feature pills -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#065F46">
    <rect x="66" y="212" width="112" height="34" rx="17" fill="#FFFFFF" stroke="#22C55E" stroke-opacity="0.35"/>
    <text x="86" y="233">AI assistant</text>
    <rect x="188" y="212" width="148" height="34" rx="17" fill="#FFFFFF" stroke="#22C55E" stroke-opacity="0.35"/>
    <text x="208" y="233">Demand forecast</text>
    <rect x="346" y="212" width="146" height="34" rx="17" fill="#FFFFFF" stroke="#22C55E" stroke-opacity="0.35"/>
    <text x="366" y="233">Smart substitutes</text>
    <rect x="502" y="212" width="132" height="34" rx="17" fill="#FFFFFF" stroke="#22C55E" stroke-opacity="0.35"/>
    <text x="522" y="233">Rider batching</text>
  </g>

  <!-- proof row -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="66" y="300" font-size="26" font-weight="800" fill="#052E16">19 ms</text>
    <text x="66" y="322" font-size="12" fill="#047857">cached AI fallback</text>
    <text x="186" y="300" font-size="26" font-weight="800" fill="#052E16">3 roles</text>
    <text x="186" y="322" font-size="12" fill="#047857">one shared API</text>
    <text x="306" y="300" font-size="26" font-weight="800" fill="#052E16">EN · KN · HI</text>
    <text x="306" y="322" font-size="12" fill="#047857">built in</text>
  </g>

  <!-- AI card -->
  <g class="float">
    <rect x="742" y="58" width="392" height="300" rx="24" fill="url(#card)" stroke="#22C55E" stroke-opacity="0.28"/>
    <rect x="742" y="58" width="392" height="300" rx="24" fill="#22C55E" fill-opacity="0.02"/>
    <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
      <circle cx="770" cy="88" r="5" fill="#4ADE80"/>
      <text x="784" y="93" font-size="13" font-weight="700" fill="#064E3B">NeuraCart AI</text>
      <rect x="1046" y="76" width="62" height="24" rx="12" fill="#ECFDF5" stroke="#22C55E" stroke-opacity="0.4"/>
      <text x="1062" y="92" font-size="10.5" font-weight="700" fill="#4ADE80">LIVE</text>

      <rect x="766" y="112" width="300" height="44" rx="12" fill="#ECFDF5"/>
      <text x="782" y="131" font-size="11.5" fill="#047857">Stock cover is 1.4 days for Tomatoes.</text>
      <text x="782" y="147" font-size="11.5" fill="#047857">Raise the morning order by 18%.</text>

      <rect x="828" y="166" width="238" height="38" rx="12" fill="#16A34A" fill-opacity="0.18" stroke="#22C55E" stroke-opacity="0.3"/>
      <text x="844" y="189" font-size="11.5" fill="#064E3B">Draft the purchase order</text>

      <rect x="766" y="216" width="300" height="52" rx="12" fill="#ECFDF5"/>
      <text x="782" y="235" font-size="11.5" fill="#065F46">Demand spike detected —</text>
      <text x="782" y="251" font-size="11.5" fill="#065F46">rain + weekend, 2.3× baseline.</text>

      <!-- sparkline -->
      <g transform="translate(1046 226)">
        <rect class="bar-1" x="0" y="14" width="7" height="16" rx="2" fill="#22C55E" opacity="0.55"/>
        <rect class="bar-2" x="11" y="6" width="7" height="24" rx="2" fill="#4ADE80" opacity="0.8"/>
        <rect class="bar-3" x="22" y="0" width="7" height="30" rx="2" fill="#86EFAC"/>
      </g>

      <!-- typing dots -->
      <circle class="dot" cx="782" cy="288" r="4" fill="#4ADE80"/>
      <circle class="dot-2" cx="796" cy="288" r="4" fill="#4ADE80"/>
      <circle class="dot-3" cx="810" cy="288" r="4" fill="#4ADE80"/>
      <text x="826" y="292" font-size="10.5" fill="#047857">thinking with guardrails…</text>
    </g>
    <rect class="sheen" x="742" y="58" width="46" height="300" fill="#4ADE80" opacity="0.12"/>
  </g>

  <!-- corner badge -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <rect x="1060" y="16" width="112" height="26" rx="13" fill="#ECFDF5" stroke="#22C55E" stroke-opacity="0.3"/>
    <text x="1077" y="33" font-size="10.5" font-weight="700" fill="#047857">v2 · AI-native</text>
  </g>
</svg>
