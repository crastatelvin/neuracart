services:
  postgres:
    image: postgres:18
    container_name: neuracart-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: neuracart
      POSTGRES_PASSWORD: neuracart
      POSTGRES_DB: neuracart
    ports:
      - '5432:5432'
    volumes:
      # postgres 18+ keeps data in a major-version subdirectory, so mount the
      # parent. mounting /var/lib/postgresql/data makes the entrypoint abort.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # -d neuracart skips the default template database check
      test: ['CMD-SHELL', 'pg_isready -U neuracart -d neuracart']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: